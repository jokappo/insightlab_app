version: "3.8"

services:

  # --- Data Lake ---
  postgres:
    image: postgres:15
    container_name: insightlab_postgres
    restart: always
    environment:
      POSTGRES_USER: insightlab
      POSTGRES_PASSWORD: insightlab
      POSTGRES_DB: insightlab_datalake
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # --- Streaming ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: insightlab_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: insightlab_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- Orchestration ---
  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: insightlab_airflow_web
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://insightlab:insightlab@postgres/insightlab_datalake
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: insightlab_datalake
      POSTGRES_USER: insightlab
      POSTGRES_PASSWORD: insightlab
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      _PIP_ADDITIONAL_REQUIREMENTS: "yfinance pandas numpy scikit-learn joblib psycopg2-binary sqlalchemy python-dotenv"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
               airflow webserver"

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: insightlab_airflow_scheduler
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://insightlab:insightlab@postgres/insightlab_datalake
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: insightlab_datalake
      POSTGRES_USER: insightlab
      POSTGRES_PASSWORD: insightlab
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      _PIP_ADDITIONAL_REQUIREMENTS: "yfinance pandas numpy scikit-learn joblib psycopg2-binary sqlalchemy python-dotenv"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    command: scheduler

volumes:
  postgres_data: